
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EggMaster 3000 | Το Τέλειο Αυγό είναι Εδώ! 🐔</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Balsamiq+Sans:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B6B',
                        secondary: '#FFB74D',
                        accent: '#FFF176',
                        dark: '#1A1A1A',
                        eggWhite: '#FFFFFF',
                        eggYolk: '#FFD93D'
                    },
                    fontFamily: {
                        display: ['Comfortaa', 'cursive'],
                        cartoon: ['Balsamiq Sans', 'cursive'],
                        sans: ['Inter', 'sans-serif']
                    },
                    boxShadow: {
                        'juicy': '0 20px 0px -5px rgba(0, 0, 0, 0.1), 0 10px 0px 0px #2D3436',
                        'btn': '0 8px 0px 0px #C0392B',
                        'btn-hover': '0 4px 0px 0px #C0392B',
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #FFF9F2; overflow-x: hidden; }
        
        .cartoon-card {
            border: 4px solid #1A1A1A;
            box-shadow: 12px 12px 0px #1A1A1A;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cartoon-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 16px 16px 0px #1A1A1A;
        }

        .floating-egg {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .steam {
            animation: steam 2s infinite;
            opacity: 0;
        }
        @keyframes steam {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
        }

        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: #1A1A1A; 
            border: 3px solid #FFF9F2;
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
